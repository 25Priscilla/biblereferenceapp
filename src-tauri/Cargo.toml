[package]
name = "versepath"
version = "0.1.0"
description = "VersePath — Every Scripture, One Tap Away."
edition = "2021"
rust-version = "1.77.2"

[lib]
# Mobile builds need a static/cdylib; `_lib` suffix avoids a name clash with the bin on Windows.
name = "versepath_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
